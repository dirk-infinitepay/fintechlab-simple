          in: path
          required: true
          description: a vendor id
          schema:
            type: string
        - name: host
          in: query
          required: false
          description: the host a platform reaches the lab at
          schema:
            type: string
      responses:
        "200":
          description: done
          content:
            text/plain:
              schema:
                type: string
        default:
          description: 'an error: 400 the caller can fix, 404 unknown, 409 refused by state, 501 not here by design, 502 a peer failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        url: docs/api/lab-api.md#get-v1connectenvservice
  /v1/connect/files/{service}/{name}:
    get:
      operationId: getConnectFilesByServiceByName
      summary: Download one key or certificate file
      description: 'Reaches: nothing — the keys directory.'
      tags:
        - connect
      parameters:
        - name: service
          in: path
          required: true
          description: a vendor id
          schema:
            type: string
        - name: name
          in: path
          required: true
