      operationId: putConfigWorldlineChannel
      summary: Change Worldline's SFT file-exchange channel config
      description: 'Reaches: worldline PUT /sim/config. The answer is the upstream''s own, status and body.'
      tags:
        - config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: true
              description: Worldline's SFT file-exchange channel config, as GET /v1/config shows it under worldline_channel
              type: object
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: the upstream's own answer, or the lab API's error when it cannot be reached
          content:
            application/json:
              schema: {}
      externalDocs:
        url: docs/api/lab-api.md#put-v1configworldline-channel
  /v1/connect:
    get:
      operationId: getConnect
      summary: 'What each vendor asks of a platform that connects: names, no values'
      description: 'Reaches: nothing — the lab API''s own state and the keys directory.'
      tags:
