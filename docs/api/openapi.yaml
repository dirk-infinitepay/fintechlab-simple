  /v1/banking-circle/payouts/{id}/return:
    post:
      operationId: postBankingCirclePayoutsByIdReturn
      summary: Return a processed payout, as the beneficiary's bank would
      description: 'Reaches: banking-circle POST /sim/payments/{id}/return.'
      tags:
