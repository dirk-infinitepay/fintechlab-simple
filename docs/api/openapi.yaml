              schema:
                format: binary
                type: string
        default:
          description: 'an error: 400 the caller can fix, 404 unknown, 409 refused by state, 501 not here by design, 502 a peer failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        url: docs/api/lab-api.md#get-v1connectfilesservicename
  /v1/environment:
    get:
      operationId: getEnvironment
      summary: 'The environment this call is in: its token''s own, or the one the admin names'
      description: 'Reaches: the lab''s database and each vendor''s control GET /sim/customers.'
      tags:
        - environments
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: 'an error: 400 the caller can fix, 404 unknown, 409 refused by state, 501 not here by design, 502 a peer failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        url: docs/api/lab-api.md#get-v1environment
  /v1/environments:
    get:
      operationId: getEnvironments
      summary: Every environment (the admin) or the caller's own, with when its platform was last seen
      description: 'Reaches: the lab''s database and each vendor''s control GET /sim/customers.'
      tags:
        - environments
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: 'an error: 400 the caller can fix, 404 unknown, 409 refused by state, 501 not here by design, 502 a peer failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        url: docs/api/lab-api.md#get-v1environments
    post:
      operationId: postEnvironments
      summary: 'Create an environment: its token, its kit, its customer at every vendor'
      description: 'Reaches: the lab''s database; each vendor''s control PUT /sim/customers/{env}.'
      tags:
        - environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                config:
                  additionalProperties: false
                  properties:
                    aci_webhook_url:
                      description: where ACI delivers this environment's webhooks
                      type: string
                    b4b_callback_url:
                      description: where B4B calls back a record that names no callback_url
                      type: string
                    clock:
                      description: 'follows or wall: a seen wall environment blocks moving the lab clock'
                      type: string
                    databases:
                      additionalProperties:
                        type: string
                      description: 'the platform''s databases by the seeder''s names (platform, settle): postgres:// URLs, shown as (set)'
                      type: object
                    poll_token:
                      description: sent to poll_url as a bearer; shown as (set), and kept when a change leaves it out
                      type: string
                    poll_url:
                      description: the platform's Worldline poll, which POST /v1/platform/poll calls
                      type: string
                    settlement_identifier:
                      description: Worldline's settlement file name for this environment
                      type: string
                    webhook_hosts:
                      description: the platform's callback hosts its subscriptions and callbacks may reach
                      items:
                        type: string
                      type: array
                  type: object
                id:
                  description: lower-case letters, digits and dashes; default the name's
                  type: string
                name:
                  description: what the environment is called; its id is made from it unless given
                  type: string
              type: object
      responses:
        "201":
          description: done
          content:
