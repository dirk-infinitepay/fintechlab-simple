# The lab API as OpenAPI 3.1, generated from cmd/labapi/routes.go and
# cmd/labapi/openapi.go. Do not edit: change those, then
#   go test ./cmd/labapi -run OpenAPI -update
# The lab API serves the same document at GET /v1/openapi.json.
openapi: 3.1.0
info:
  title: fintechlab lab API
  version: v1
  description: 'The one API over the lab: merchants, the clock, settlement runs and what happened, every simulation''s record, health, logs and reset, and its lab hooks (/sim/*) through one passthrough. The lab API reaches each simulation on its control port and holds no vendor credentials; a platform calls the vendors directly. Errors are {"error", "status"}. When LAB_API_TOKEN is set, every call but GET /health carries Authorization: Bearer <it>. The console''s old /api paths still answer, as aliases, and are not listed.'
servers:
  - url: http://127.0.0.1:8097
    description: the lab API
  - url: http://127.0.0.1:8090
    description: through the console, which forwards /v1
tags:
  - name: lab
    description: 'What is running and what it has done: the index, the run diagram, the stand-ins.'
  - name: environments
    description: The platforms the lab serves, each with its own token and its own customers at the vendors.
  - name: services
    description: 'Each service of the lab: its record and health, its logs, and its /sim/* hooks through one address.'
  - name: traps
    description: 'Instructions armed in a simulation for a future event: read and disarm them across the lab; arm one through the passthrough.'
  - name: clock
    description: The lab's business clock, fronted from the clock service.
  - name: config
    description: What the lab is set to, and the one setting the lab API can change.
  - name: merchants
    description: The lab's merchant registry, and putting its merchants on the vendors.
  - name: banks
    description: Accounts and payouts at the business bank and Banking Circle.
  - name: actions
    description: Make a vendor do now what it would otherwise do on its schedule.
  - name: card
    description: 'The environment''s own card: its settlement files, publishing them at Worldline, and the platform''s poll.'
  - name: plugins
    description: 'The platform under test: registration, its buttons and its settlement files.'
  - name: connect
    description: 'What a platform needs to point at this lab: addresses, credentials, key files.'
paths:
  /health:
    get:
      operationId: getHealth
      summary: Whether the lab API process is up
      description: 'Reaches: nothing — the lab API''s own state.'
      tags:
        - lab
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: 'an error: 400 the caller can fix, 404 unknown, 409 refused by state, 501 not here by design, 502 a peer failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        url: docs/api/lab-api.md#get-health
  /v1:
    get:
      operationId: getIndex
      summary: 'This index: every route, its alias, its group and what it reaches'
      description: 'Reaches: nothing — the lab API''s own state.'
      tags:
        - lab
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: 'an error: 400 the caller can fix, 404 unknown, 409 refused by state, 501 not here by design, 502 a peer failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        url: docs/api/lab-api.md#get-v1
  /v1/actions/fund-sga:
    post:
      operationId: postActionsFundSga
      summary: Fund the empty safeguarding accounts, as Worldline's wire would
      description: 'Reaches: banking-circle /sim/accounts/{id}/balances, /sim/incoming-payments.'
      tags:
        - banks
      parameters:
        - name: amount
          in: query
          required: false
          description: a decimal per empty safeguarding account; default 1000000.00
          schema:
            type: string
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: 'an error: 400 the caller can fix, 404 unknown, 409 refused by state, 501 not here by design, 502 a peer failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        url: docs/api/lab-api.md#post-v1actionsfund-sga
  /v1/actions/settlement-pull:
    post:
      operationId: postActionsSettlementPull
      summary: Make the settlement stand-in pull Worldline's SFTP now
      description: 'Reaches: settlement POST /sim/pull. The answer is the upstream''s own, status and body.'
      tags:
        - actions
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: the upstream's own answer, or the lab API's error when it cannot be reached
          content:
            application/json:
              schema: {}
      externalDocs:
        url: docs/api/lab-api.md#post-v1actionssettlement-pull
  /v1/actions/worldline-cycle:
    post:
      operationId: postActionsWorldlineCycle
      summary: Cut and publish Worldline's settlement files now
      description: 'Reaches: worldline POST /sim/settlement-cycle/run. The answer is the upstream''s own, status and body.'
      tags:
        - actions
      parameters:
        - name: slot
          in: query
          required: false
          description: default morning
          schema:
            enum:
              - morning
              - afternoon
            type: string
        - name: date
          in: query
          required: false
          description: YYYY-MM-DD, the business day the file covers; default the lab clock's
          schema:
            type: string
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: the upstream's own answer, or the lab API's error when it cannot be reached
          content:
            application/json:
              schema: {}
      externalDocs:
        url: docs/api/lab-api.md#post-v1actionsworldline-cycle
  /v1/banking-circle/payouts:
    get:
      operationId: getBankingCirclePayouts
      summary: Banking Circle's outgoing payouts, and which can be returned or reversed
      description: 'Reaches: banking-circle GET /sim/payments.'
