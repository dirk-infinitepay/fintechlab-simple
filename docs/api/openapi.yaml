      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: 'an error: 400 the caller can fix, 404 unknown, 409 refused by state, 501 not here by design, 502 a peer failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        url: docs/api/lab-api.md#get-v1banks
  /v1/banks/{id}/accounts:
    post:
      operationId: postBanksByIdAccounts
      summary: 'Open an account at the business bank (Banking Circle: 501)'
      description: 'Reaches: bank POST /sim/accounts.'
      tags:
        - banks
      parameters:
        - name: id
          in: path
          required: true
          description: core-ledger or banking-circle
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                currency:
                  description: ISO 4217
                  type: string
                holder:
                  description: ""
                  type: string
                opening_balance:
                  description: a decimal, default 0.00
                  type: string
              required:
                - holder
              type: object
      responses:
        "201":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: 'an error: 400 the caller can fix, 404 unknown, 409 refused by state, 501 not here by design, 502 a peer failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        url: docs/api/lab-api.md#post-v1banksidaccounts
  /v1/clock:
    get:
      operationId: getClock
      summary: The lab clock as it stands
      description: 'Reaches: clock GET /clock.'
      tags:
        - clock
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: 'an error: 400 the caller can fix, 404 unknown, 409 refused by state, 501 not here by design, 502 a peer failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        url: docs/api/lab-api.md#get-v1clock
    post:
      operationId: postClock
      summary: Move the lab clock, or change its mode
      description: 'Reaches: clock POST /clock. The answer is the upstream''s own, status and body.'
      tags:
        - clock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: exactly one of at, advance or mode
              oneOf:
                - additionalProperties: false
                  properties:
                    at:
                      description: an RFC 3339 instant to pin the lab clock to
                      type: string
                  required:
                    - at
                  type: object
                - additionalProperties: false
                  properties:
                    advance:
                      description: 'how far to move it on: "1h", "1d"'
                      type: string
                  required:
                    - advance
                  type: object
                - additionalProperties: false
                  properties:
                    mode:
                      description: real follows the wall clock; auto-business-day the most recent business day
                      enum:
                        - real
                        - auto-business-day
                      type: string
                  required:
                    - mode
                  type: object
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: the upstream's own answer, or the lab API's error when it cannot be reached
          content:
            application/json:
              schema: {}
      externalDocs:
        url: docs/api/lab-api.md#post-v1clock
  /v1/clock/holds:
    post:
      operationId: postClockHolds
      summary: 'Hold the lab clock while a run is in flight: moves are refused'
      description: 'Reaches: clock POST /clock/holds. The answer is the upstream''s own, status and body.'
      tags:
        - clock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                holder:
                  description: 'who holds it: the name to release it by'
                  type: string
                reason:
                  description: why, shown to anyone whose move is refused
                  type: string
                ttl_seconds:
                  description: how long the hold lasts unless renewed or released
                  type: integer
              required:
                - holder
              type: object
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: the upstream's own answer, or the lab API's error when it cannot be reached
          content:
            application/json:
              schema: {}
      externalDocs:
        url: docs/api/lab-api.md#post-v1clockholds
  /v1/clock/holds/{holder}:
    delete:
      operationId: deleteClockHoldsByHolder
      summary: Release a hold on the lab clock
      description: 'Reaches: clock DELETE /clock/holds/{holder}. The answer is the upstream''s own, status and body.'
      tags:
        - clock
      parameters:
        - name: holder
          in: path
          required: true
          description: the holder named when the hold was taken
          schema:
            type: string
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: the upstream's own answer, or the lab API's error when it cannot be reached
          content:
            application/json:
              schema: {}
      externalDocs:
        url: docs/api/lab-api.md#delete-v1clockholdsholder
