          content:
            text/plain:
              schema:
                type: string
        default:
          description: 'an error: 400 the caller can fix, 404 unknown, 409 refused by state, 501 not here by design, 502 a peer failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      externalDocs:
        url: docs/api/lab-api.md#get-v1connectenv
  /v1/connect/env/{service}:
