      description: 'Reaches: banking-circle /sim/delivery-config, worldline GET /sim/config.'
      tags:
        - config
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: 'an error: 400 the caller can fix, 404 unknown, 409 refused by state, 501 not here by design, 502 a peer failed'
          content:
            application/json:
              schema:
