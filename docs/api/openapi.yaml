      parameters:
        - name: id
          in: path
          required: true
          description: a Banking Circle payment id
          schema:
            type: string
      responses:
        "200":
          description: done
          content:
            application/json:
              schema:
                type: object
        default:
          description: 'an error: 400 the caller can fix, 404 unknown, 409 refused by state, 501 not here by design, 502 a peer failed'
          content:
            application/json:
