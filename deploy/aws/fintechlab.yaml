AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  fintechlab-simple: the vendor simulations as one podman pod on one EC2 host,
  in a VPC of its own. It references no other stack, export or shared resource,
  so it can live in an account with other workloads and be deleted without
  touching them. deploy/aws/lab.sh drives it; docs/deploy-cloud.md explains it.

# What is here, and why only this:
#   - a VPC, one public subnet and an internet gateway: the lab's own network,
#     so nothing about it depends on (or blocks deleting) anyone else's;
#   - one instance, managed by SSM only -- no SSH key, no port 22;
#   - a data volume for podman's storage, so the lab's keys and state survive
#     a replaced instance;
#   - an Elastic IP, the lab's one stable address (and, optionally, a DNS
#     record for it in a hosted zone you name);
#   - a security group open only to the addresses on the lab's allowlist, a
#     managed prefix list, on the vendors' surfaces, the console and the lab
#     API -- never a control port. The template creates the list and never
#     sets its entries: people add and remove theirs (lab.sh allow, or the
#     VPC console) and the stack does not drift, since CloudFormation checks
#     only the properties a template sets;
#   - a private bucket the deploy script hands bundles over through.
# Nothing in the instance's user data: deploy/host/play.sh prepares the host
# on the first deploy, so editing it never replaces the instance.

Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Ubuntu 24.04 LTS, amd64 (podman 4.9 is in its archive, the SSM agent is
      preinstalled). lab.sh resolves the current one when it creates the stack
      and keeps it on every update after, so a new Canonical image never
      replaces the lab host on its own.
  InstanceType:
    Type: String
    Default: t3.small
    Description: Thirteen small Go containers. Must be amd64 -- the images are built on one.
  VpcCidr:
    Type: String
    Default: 10.77.0.0/24
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-8])$
    Description: The lab VPC's range. It is never peered, so it only has to be a valid private range.
  DataVolumeGiB:
    Type: Number
    Default: 20
    MinValue: 10
    Description: podman's images, containers and the pod's five named volumes.
  DomainName:
    Type: String
    Default: ""
    Description: >-
      The name the lab is reached at, if any (e.g. lab.example.com). Empty:
      its Elastic IP. With HostedZoneId the stack writes the A record too;
      without, point the name at the PublicIp output yourself.
  HostedZoneId:
    Type: String
    Default: ""
    Description: A Route 53 public hosted zone to write DomainName's A record in. Empty writes none.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  WriteDnsRecord: !And
    - !Condition HasDomain
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  # --- network: the lab's own -------------------------------------------------

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref VpcCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      # The instance reaches apt and SSM on its own public address until the
      # Elastic IP replaces it.
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  # --- who may reach it ---------------------------------------------------------

  # Who may reach the lab: an allowlist people edit, not a parameter. No
  # Entries here, ever -- the template setting none is what keeps an entry
  # added outside it from being drift. Nothing about the list may change in
  # the template either (lab.sh infra restores entries around an update
  # anyway). MaxEntries is what each rule below costs against the security
  # group's limit (60 by default): three rules, twenty entries.
  AllowList:
    Type: AWS::EC2::PrefixList
    Properties:
      PrefixListName: !Sub ${AWS::StackName}-allowed
      AddressFamily: IPv4
      MaxEntries: 20

  # Attach to a role or permission set whose people may edit the allowlist:
  # this list only, nothing else in the stack or the account.
  AllowListEditors:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Add and remove addresses on the allowlist of one fintechlab lab
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:ModifyManagedPrefixList
              - ec2:GetManagedPrefixListEntries
            Resource: !GetAtt AllowList.Arn
          - Effect: Allow
            Action: ec2:DescribeManagedPrefixLists
            Resource: "*"
          - Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Ref AWS::StackId

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: fintechlab lab ports, open to the allowlist only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: webhooks to the platform, apt, SSM
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  # Not 8095 (Banking Circle's bridge, lab plumbing with no auth), not the
  # control ports (each vendor's port plus 1000) -- from outside, the lab API
  # is the one way to steer the lab -- and not 8443, the receiver stand-in,
  # which nothing outside calls (a fourth rule would cost twenty more).
  LabIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8090
      SourcePrefixListId: !Ref AllowList
      Description: the vendor surfaces and the console 8090

  LabApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 8097
      ToPort: 8097
      SourcePrefixListId: !Ref AllowList
      Description: the lab API, behind its token

  SftpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 2222
      ToPort: 2222
      SourcePrefixListId: !Ref AllowList
      Description: Worldline SFTP+PGP

  # --- the host -------------------------------------------------------------------

  # SSM only. The lab's containers cannot reach the instance metadata service
  # (IMDSv2, hop limit 1), so nothing in a container can act as this role --
  # which can do nothing but be managed by SSM anyway.
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      Description: fintechlab lab host, managed by SSM
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore

  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref HostRole

  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref HostProfile
      SubnetId: !Ref Subnet
      SecurityGroupIds:
        - !Ref SecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  # The lab's keys and state. Separate from the root volume, so replacing the
  # instance (a new image, a new type) keeps every key a platform holds.
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AvailabilityZone: !GetAtt Subnet.AvailabilityZone
      Size: !Ref DataVolumeGiB
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-data

  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref Host
      VolumeId: !Ref DataVolume
      Device: /dev/sdf

  # --- the address --------------------------------------------------------------------

  Address:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref Host
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: WriteDnsRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      TTL: "300"
      ResourceRecords:
        - !GetAtt Address.PublicIp

  # --- handing bundles over -------------------------------------------------------------

  # lab.sh uploads a bundle here and gives the host a presigned URL for it,
  # so the host's role needs no S3 access at all. A bundle is only needed
  # until the host has loaded it.
  Releases:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-bundles
            Status: Enabled
            ExpirationInDays: 7

Outputs:
  InstanceId:
    Value: !Ref Host
  PublicIp:
    Value: !GetAtt Address.PublicIp
  PublicHost:
    Description: The address a platform reaches the lab at, and the one its certificates name.
    Value: !If [HasDomain, !Ref DomainName, !GetAtt Address.PublicIp]
  ConsoleUrl:
    Description: Reachable from the allowlist (lab.sh allow); otherwise lab.sh console forwards it to 127.0.0.1.
    Value: !Sub
      - http://${Host}:8090
      - Host: !If [HasDomain, !Ref DomainName, !GetAtt Address.PublicIp]
  LabApiUrl:
    Description: The platform's FINTECH_SIM_LAB_URL. lab.sh token prints the token it asks for.
    Value: !Sub
      - http://${Host}:8097
      - Host: !If [HasDomain, !Ref DomainName, !GetAtt Address.PublicIp]
  DataVolumeId:
    Value: !Ref DataVolume
  AllowListId:
    Description: The managed prefix list of who may reach the lab. lab.sh allow / deny edit it.
    Value: !Ref AllowList
  AllowListEditorsPolicyArn:
    Description: Attach to whoever may edit the allowlist.
    Value: !Ref AllowListEditors
  ReleaseBucket:
    Value: !Ref Releases
